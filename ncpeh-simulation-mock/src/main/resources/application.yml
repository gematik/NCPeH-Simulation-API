server:
  port: 8082
  ssl:
    enabled: false

cxf:
  jaxrs:
    component-scan: true
    classes-scan-packages: org.apache.cxf.jaxrs.swagger
  path: "/rest"
  openapi:
    resource-packages: de.gematik.ncpeh.api
    url: "${cxf.path}/openapi.json"

management:
  endpoints:
    access.default: none
    web:
      exposure:
        include: "health, info, mappings, metrics"
  endpoint:
    health:
      access: read-only
    mappings:
      access: read-only
    info:
      access: read-only
    metrics:
      access: read-only
  info:
    env:
      enabled: true

logging:
  level:
    de.gematik.ncpeh: INFO
    org.apache.cxf.services: DEBUG

info:
  app:
    name: '@project.name@'
    version: '@project.version@'
    description: '@project.description@'
